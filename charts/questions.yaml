questions:

# --------------------------------------------------------------------
# Cluster
# --------------------------------------------------------------------

- variable: cluster.name
  label: Cluster Name
  type: string
  required: true
  default: fc00
  group: Cluster

- variable: cluster.namespace
  label: Namespace
  type: string
  required: true
  default: fleet-default
  group: Cluster

- variable: cluster.cloudCredentialSecretName
  label: Cloud Credential
  type: cloudcredential
  required: true
  group: Cluster

- variable: cluster.kubernetesVersion
  label: Kubernetes Version
  type: string
  required: true
  default: v1.35.6+rke2r1
  group: Cluster

# --------------------------------------------------------------------
# Control Plane
# --------------------------------------------------------------------

- variable: controlPlane.quantity
  label: Number of Control Plane Nodes
  type: int
  default: 1
  min: 1
  required: true
  group: Control Plane

- variable: controlPlane.workerRole
  label: Control Plane also acts as Worker
  type: boolean
  default: false
  group: Control Plane

# --------------------------------------------------------------------
# Worker
# --------------------------------------------------------------------

- variable: worker.enabled
  label: Create Worker Pool
  type: boolean
  default: true
  group: Worker

- variable: worker.quantity
  label: Number of Worker Nodes
  type: int
  default: 1
  min: 1
  show_if: worker.enabled=true
  group: Worker


# --------------------------------------------------------------------
# FSAS Control Plane
# --------------------------------------------------------------------

- variable: fsas.controlPlane.computeConditionsJson
  label: Control Plane Compute Conditions (JSON)
  type: multiline
  group: FSAS Control Plane

- variable: fsas.controlPlane.devicesSpecJson
  label: Control Plane Device Specification (JSON)
  type: multiline
  group: FSAS Control Plane

- variable: fsas.controlPlane.enableBaremetalBonding
  label: Enable Baremetal Bonding
  type: boolean
  default: false
  group: FSAS Control Plane

- variable: fsas.controlPlane.networkBaremetalUuid
  label: Baremetal Network UUID
  type: string
  group: FSAS Control Plane

- variable: fsas.controlPlane.networkProvisionUuid
  label: Provisioning Network UUID
  type: string
  group: FSAS Control Plane

- variable: fsas.controlPlane.networkProvisionDefaultGw
  label: Provisioning Gateway
  type: string
  group: FSAS Control Plane

- variable: fsas.controlPlane.osImageName
  label: Control Plane OS Image
  type: string
  default: sles16
  group: FSAS Control Plane

- variable: fsas.controlPlane.imageOsSshHostPubKey
  label: SSH Host Public Key
  type: multiline
  group: FSAS Control Plane

- variable: fsas.controlPlane.sshUser
  label: SSH User
  type: string
  default: rancher
  group: FSAS Control Plane

- variable: fsas.controlPlane.sshPassword
  label: SSH Password
  type: password
  default: rancher
  group: FSAS Control Plane

- variable: fsas.controlPlane.userdata
  label: Userdata
  type: multiline
  group: FSAS Control Plane

# --------------------------------------------------------------------
