- variable: fsas.worker.networkBaremetalUuid
  label: Baremetal Network UUID
  type: string
  group: FSAS Worker

- variable: fsas.worker.networkProvisionUuid
  label: Provisioning Network UUID
  type: string
  group: FSAS Worker

- variable: fsas.worker.networkProvisionDefaultGw
  label: Provisioning Gateway
  type: string
  group: FSAS Worker

- variable: fsas.worker.osImageName
  label: Worker OS Image
  type: string
  default: sles16
  group: FSAS Worker

- variable: fsas.worker.imageOsSshHostPubKey
  label: SSH Host Public Key
  type: multiline
  group: FSAS Worker

- variable: fsas.worker.sshUser
  label: SSH User
  type: string
  default: rancher
  group: FSAS Worker

- variable: fsas.worker.sshPassword
  label: SSH Password
